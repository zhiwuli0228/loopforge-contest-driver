name: c2r-migration
version: 1
description: Agent-first C-to-Rust migration workflow — thinking (proposal → specs → design → tasks) + execution (implement-plan → verification-report)
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
    requires: []

  - id: brainstorm
    generates: 01c-capability-map.json
    description: Capability map from the C source analysis (produced by the understand phase)
    template: capability-map.json
    instruction: |
      Create the capability map that captures the results of C source analysis.

      This artifact is produced during the Understand phase alongside the source inventory.
      It SHALL contain:
      - A list of identified capabilities with IDs, names, priorities, and source module references
      - A dependency graph (DAG) between capabilities
      - Test coverage gaps identified during C source analysis
      - Synthesis notes documenting merged capabilities and warnings

      When available, the capability map is the authoritative input for spec creation,
      task planning, and batch ordering. When not available, downstream artifacts
      derive capabilities from the proposal's Capabilities section.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change — one spec per capability
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      If a capability map (brainstorm artifact) is available:
      - Create one spec file per capability from the capability map.
      - Use the exact capability ID from the map (specs/<capability-id>/spec.md).
      - Reference C source file and line numbers for every requirement.
      - Include an Invariants section per capability using invariants from the scenario documents.

      If no capability map is available:
      - Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name.

      Format requirements (apply regardless of input source):
      - Each requirement: `### Requirement: <id>-NNN` followed by description
      - Use SHALL/MUST for normative requirements
      - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format
      - Every requirement MUST have at least 3 scenarios (normal, error, boundary)
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.

      Sections:
      - **Context**: Background, current state, constraints
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale and rejected alternatives
      - **Risks / Trade-offs**: Known limitations, things that could go wrong
      - **Open Questions**: Outstanding decisions or unknowns

      If a capability map (brainstorm artifact) is available, also include:
      - **Capability Mapping**: Table mapping every capability from the brainstorm to Rust modules.
        Every capability from the capability map MUST appear in this table.

      If no capability map is available, include:
      - **Module Mapping**: For each C source file/component, state the corresponding Rust module path.

      Focus on architecture and approach, not line-by-line implementation.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      If a capability map (brainstorm artifact) is available:
      - Each batch = ONE capability = implementation tasks + unit test tasks + verification tasks
      - Batch order follows the dependency graph in the capability map
      - Reference spec requirements: `REQ-<capability-id>-NNN`
      - Never separate implementation and testing into different batches

      If no capability map is available:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - specs
      - design

  - id: implement-plan
    generates: implement-plan.md
    description: Batch-level implementation plan mapping specs to code
    template: implement-plan.md
    instruction: |
      Create the implementation plan that maps specifications to code batches.

      Read the specs and tasks to identify:
      - Which source modules/functions each spec covers
      - How to group work into batches (5-8 functions per batch)
      - Expected build and test commands per batch
      - Subagent assignment strategy

      Each batch should be independently buildable and testable.
      The plan drives Phase 5-6 execution (implement + test per batch).
    requires:
      - tasks

  - id: verification-report
    generates: verification-report.md
    description: Aggregated build/test/repair/gate results
    template: verification-report.md
    instruction: |
      Create the verification report that aggregates all execution results.

      Record:
      - Cargo build results per batch (pass/fail, errors, fixes)
      - Cargo test results per batch (pass/fail, coverage)
      - Repair cycles (diagnostics, fixes applied, retries)
      - Semantic audit outcomes (invariants verified)
      - Quality gate results (unsafe ratio, fault injection, neutrality)
      - Final pass/fail assessment

      This is the single source of truth for migration verification.
    requires:
      - implement-plan

apply:
  requires:
    - verification-report
  tracks: tasks.md
