framework:
  name: "loopforge-contest-driver"
  input_model: "preloaded-design-plus-source"
  default_mode: "consistency-check"

platform:
  layout: "single-root"
  work_dir: "work"
  windows_code_dir: "work/code"
  linux_source_root_env: "SOURCE_ROOT"
  artifact_dir: "logs/trace"
  official_submission_os: "linux"
  local_development_os:
    - "windows"
    - "linux"

source:
  root_env: "SOURCE_ROOT"

design:
  readme: "work/design/README.md"
  required: true
  authoritative: true

task:
  name: "design-implementation-consistency-check"
  mode: "consistency-check"
  source: "preloaded-design"
  profile: "profiles/examples/default-java-consistency.yaml"

language:
  default: "java"
  detection: "auto"
  adapter: "java"
  fallback_adapter: "generic"
  adapters:
    - "java"
    - "generic"

objective: "compare the documented design contract with the implementation under SOURCE_ROOT and report drift without mutating the source tree"

execution:
  strategy: "analyze-only"
  unattended: true
  allow_manual_interaction: false
  allow_patch: false
  max_repair_rounds: 0
  max_semantic_repair_rounds: 0
  # Optional unattended agent/fixer executable. It receives the task JSON path
  # as argv and through LOOPFORGE_REPAIR_TASK; env LOOPFORGE_REPAIR_COMMAND
  # overrides this setting on both Windows and Linux.
  repair_provider:
    enabled: "auto"
    command: null
  fail_soft: true
  always_finalize: true
  allow_code_generation: false
  allow_static_rule_modification: false
  commit: false
  push: false
  create_pr: false

mode_selection:
  source: "preloaded-design"
  fallback: "consistency-check"

coding_skill:
  enabled: false
  required: false
  skill: "skills/code-implementation/SKILL.md"
  apply_at: []
  output: "logs/trace/consistency/05-analysis-summary.md"

verification:
  source: "profile-or-framework-default"
  working_directory: "SOURCE_ROOT"
  timeout_seconds: 18000
  commands:
    default:
      - "auto-detect"

outputs:
  result_report: "result/output.md"
  issue_summary: "result/issues/00-summary.md"
  trace_dir: "logs/trace"
  interaction_log: "logs/interaction.md"
  consistency_dir: "logs/trace/consistency"
  source_inventory: "logs/trace/consistency/02-source-inventory.md"
  source_inventory_data: "logs/trace/consistency/02-source-inventory.json"
  adapter_selection: "logs/trace/consistency/02-adapter-selection.json"
  design_model: "logs/trace/consistency/03-design-model.json"
  implementation_model: "logs/trace/consistency/04-implementation-model.json"
  traceability_matrix: "logs/trace/consistency/05-traceability-matrix.json"
  drift_report: "logs/trace/consistency/06-drift-analysis.md"
  risk_report: "logs/trace/consistency/07-risk-classification.md"
  repair_plan: "logs/trace/consistency/08-repair-plan.md"
  final_report: "logs/trace/final-report.md"
