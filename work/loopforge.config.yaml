framework:
  name: "loopforge-contest-driver"
  input_model: "standard-submission-package"
  default_mode: "consistency-check"

platform:
  layout: "single-root"
  work_dir: "work"
  windows_code_dir: "work/code"
  linux_submission_root_env: "SUBMISSION_ROOT"
  artifact_dir: "logs/trace"
  official_submission_os: "linux"
  local_development_os:
    - "windows"
    - "linux"

submission:
  root_env: "SUBMISSION_ROOT"
  legacy_root_env: "SOURCE_ROOT"
  readme: "README.md"
  design_dir: "design-docs"
  code_dir: "code"
  test_dir: "test-cases"
  metadata_files:
    - "contest.meta.yaml"
    - "contest.meta.yml"
  mutable_support_assets:
    - "maven-settings.xml"

design:
  readme: "work/design/README.md"
  required: true
  authoritative: false

task:
  name: "design-implementation-consistency-check"
  mode: "consistency-check"
  source: "submission-package"
  profile: "profiles/examples/default-java-consistency.yaml"

language:
  default: "java"
  detection: "auto"
  adapter: "java"
  fallback_adapter: "generic"
  adapters:
    - "java"
    - "generic"

objective: "repair the implementation in SUBMISSION_ROOT/code to satisfy the submission README and design-docs contract while preserving immutable baselines and proving progress with ordered verification"

execution:
  strategy: "repair-and-verify"
  unattended: true
  allow_manual_interaction: false
  allow_patch: true
  max_repair_rounds: 1
  max_semantic_repair_rounds: 0
  repair_provider:
    enabled: "auto"
    command: null
  fail_soft: true
  always_finalize: true
  allow_code_generation: true
  allow_static_rule_modification: false
  commit: false
  push: false
  create_pr: false

mode_selection:
  source: "submission-package"
  fallback: "consistency-check"

coding_skill:
  enabled: false
  required: false
  skill: "skills/code-implementation/SKILL.md"
  apply_at: []
  output: "logs/trace/consistency/05-repair-execution.md"

verification:
  source: "submission-readme-first"
  working_directory: "SUBMISSION_ROOT"
  timeout_seconds: 18000
  commands:
    ordered:
      - name: "project_tests"
        command: "mvn -s maven-settings.xml -f code/pom.xml test"
      - name: "project_install"
        command: "mvn -s maven-settings.xml -f code/pom.xml install -DskipTests"
      - name: "black_box_tests"
        command: "mvn -s maven-settings.xml -f test-cases/pom.xml test"

outputs:
  result_report: "result/output.md"
  issue_summary: "result/issues/00-summary.md"
  trace_dir: "logs/trace"
  interaction_log: "logs/interaction.md"
  consistency_dir: "logs/trace/consistency"
  acceptance_baseline: "logs/trace/consistency/01-acceptance-baseline.json"
  source_inventory: "logs/trace/consistency/02-source-inventory.md"
  source_inventory_data: "logs/trace/consistency/02-source-inventory.json"
  adapter_selection: "logs/trace/consistency/02-adapter-selection.json"
  gap_model: "logs/trace/consistency/03-gap-model.json"
  repair_batches: "logs/trace/consistency/04-repair-batches.md"
  repair_batches_data: "logs/trace/consistency/04-repair-batches.json"
  repair_execution: "logs/trace/consistency/05-repair-execution.md"
  build_verification: "logs/trace/consistency/06-build-verification.md"
  black_box_verification: "logs/trace/consistency/07-black-box-verification.md"
  retry_repair: "logs/trace/consistency/08-retry-repair.md"
  final_report: "logs/trace/final-report.md"
