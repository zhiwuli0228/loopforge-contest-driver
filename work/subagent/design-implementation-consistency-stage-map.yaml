stage_packages:
  - stage_id: "dic-00"
    file: "work/subagent/dic-00-preflight.md"
    purpose: "Validate inputs, mutable support-asset policy, and execution defaults."
    summary_output: "logs/trace/consistency/00-preflight-report.md"
    gate_output: "logs/trace/consistency/00-preflight-gate.json"
    evidence_index: "logs/trace/consistency/00-preflight-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/00-submission-layout.json"
  - stage_id: "dic-01"
    file: "work/subagent/dic-01-design-intake.md"
    purpose: "Extract the acceptance baseline from README.md and design-docs/."
    summary_output: "logs/trace/consistency/01-design-intake.md"
    gate_output: "logs/trace/consistency/01-design-intake-gate.json"
    evidence_index: "logs/trace/consistency/01-design-intake-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/01-acceptance-baseline.json"
  - stage_id: "dic-02"
    file: "work/subagent/dic-02-source-inventory.md"
    purpose: "Inventory code, test-cases, support assets, and adapter selection."
    summary_output: "logs/trace/consistency/02-source-inventory.md"
    gate_output: "logs/trace/consistency/02-source-inventory-gate.json"
    evidence_index: "logs/trace/consistency/02-source-inventory-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/02-adapter-selection.json"
  - stage_id: "dic-03"
    file: "work/subagent/dic-03-design-model.md"
    purpose: "Model acceptance-baseline-to-implementation gaps with evidence from both sides."
    summary_output: "logs/trace/consistency/03-gap-model-summary.md"
    gate_output: "logs/trace/consistency/03-gap-model-gate.json"
    evidence_index: "logs/trace/consistency/03-gap-model-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/03-gap-model.json"
  - stage_id: "dic-04"
    file: "work/subagent/dic-04-implementation-model.md"
    purpose: "Produce bounded repair batches and verification intent."
    summary_output: "logs/trace/consistency/04-repair-batches.md"
    gate_output: "logs/trace/consistency/04-repair-batches-gate.json"
    evidence_index: "logs/trace/consistency/04-repair-batches-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/04-repair-batches.json"
  - stage_id: "dic-05"
    file: "work/subagent/dic-05-traceability-map.md"
    purpose: "Apply bounded repairs and record changed targets as evidence."
    summary_output: "logs/trace/consistency/05-repair-execution.md"
    gate_output: "logs/trace/consistency/05-repair-execution-gate.json"
    evidence_index: "logs/trace/consistency/05-repair-execution-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/05-repair-execution.json"
  - stage_id: "dic-06"
    file: "work/subagent/dic-06-drift-analysis.md"
    purpose: "Run build and project-owned verification required before black-box tests."
    summary_output: "logs/trace/consistency/06-build-verification.md"
    gate_output: "logs/trace/consistency/06-build-verification-gate.json"
    evidence_index: "logs/trace/consistency/06-build-verification-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/06-build-verification.json"
  - stage_id: "dic-07"
    file: "work/subagent/dic-07-risk-classification.md"
    purpose: "Run package-owned black-box verification and preserve ordered verification evidence."
    summary_output: "logs/trace/consistency/07-black-box-verification.md"
    gate_output: "logs/trace/consistency/07-black-box-verification-gate.json"
    evidence_index: "logs/trace/consistency/07-black-box-verification-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/07-black-box-verification.json"
  - stage_id: "dic-08"
    file: "work/subagent/dic-08-repair-plan.md"
    purpose: "Perform targeted regression repair from failed verification evidence."
    summary_output: "logs/trace/consistency/08-retry-repair.md"
    gate_output: "logs/trace/consistency/08-retry-repair-gate.json"
    evidence_index: "logs/trace/consistency/08-retry-repair-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/08-retry-repair.json"
  - stage_id: "dic-09"
    file: "work/subagent/dic-09-finalize.md"
    purpose: "Assemble final reporting, verification rollup, and delivery verdict."
    summary_output: "logs/trace/consistency/09-finalization-summary.md"
    gate_output: "logs/trace/consistency/09-finalization-gate.json"
    evidence_index: "logs/trace/consistency/09-finalization-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/09-verification-results.json"
      - "logs/trace/consistency/09-final-report-input.json"
      - "logs/trace/final-report.md"
      - "result/output.md"
      - "result/issues/00-summary.md"
