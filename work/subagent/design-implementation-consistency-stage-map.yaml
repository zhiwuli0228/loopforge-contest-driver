stage_packages:
  - stage_id: "dic-00"
    file: "work/subagent/dic-00-preflight.md"
    purpose: "Validate inputs, resolve profile, and record execution defaults."
    summary_output: "logs/trace/consistency/00-preflight-report.md"
    gate_output: "logs/trace/consistency/00-preflight-gate.json"
    evidence_index: "logs/trace/consistency/00-preflight-evidence.json"
    structured_outputs: []
  - stage_id: "dic-01"
    file: "work/subagent/dic-01-design-intake.md"
    purpose: "Summarize the authoritative design contract and scope."
    summary_output: "logs/trace/consistency/01-design-intake.md"
    gate_output: "logs/trace/consistency/01-design-intake-gate.json"
    evidence_index: "logs/trace/consistency/01-design-intake-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/01-design-inventory.json"
  - stage_id: "dic-02"
    file: "work/subagent/dic-02-source-inventory.md"
    purpose: "Inventory source layout, verification entry points, and adapter selection."
    summary_output: "logs/trace/consistency/02-source-inventory.md"
    gate_output: "logs/trace/consistency/02-source-inventory-gate.json"
    evidence_index: "logs/trace/consistency/02-source-inventory-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/02-adapter-selection.json"
  - stage_id: "dic-03"
    file: "work/subagent/dic-03-design-model.md"
    purpose: "Normalize the design contract into the canonical design model."
    summary_output: "logs/trace/consistency/03-design-model-summary.md"
    gate_output: "logs/trace/consistency/03-design-model-gate.json"
    evidence_index: "logs/trace/consistency/03-design-model-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/03-design-model.json"
  - stage_id: "dic-04"
    file: "work/subagent/dic-04-implementation-model.md"
    purpose: "Extract the implementation model through the selected adapter."
    summary_output: "logs/trace/consistency/04-implementation-model-summary.md"
    gate_output: "logs/trace/consistency/04-implementation-model-gate.json"
    evidence_index: "logs/trace/consistency/04-implementation-model-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/04-implementation-model.json"
  - stage_id: "dic-05"
    file: "work/subagent/dic-05-traceability-map.md"
    purpose: "Produce the traceability map between design and implementation."
    summary_output: "logs/trace/consistency/05-traceability-map.md"
    gate_output: "logs/trace/consistency/05-traceability-map-gate.json"
    evidence_index: "logs/trace/consistency/05-traceability-map-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/05-traceability-matrix.json"
  - stage_id: "dic-06"
    file: "work/subagent/dic-06-drift-analysis.md"
    purpose: "Analyze confirmed and candidate design-implementation drift."
    summary_output: "logs/trace/consistency/06-drift-analysis.md"
    gate_output: "logs/trace/consistency/06-drift-analysis-gate.json"
    evidence_index: "logs/trace/consistency/06-drift-analysis-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/06-drift-findings.json"
  - stage_id: "dic-07"
    file: "work/subagent/dic-07-risk-classification.md"
    purpose: "Assign severity and execution risk to confirmed findings."
    summary_output: "logs/trace/consistency/07-risk-classification.md"
    gate_output: "logs/trace/consistency/07-risk-classification-gate.json"
    evidence_index: "logs/trace/consistency/07-risk-classification-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/07-risk-classification.json"
  - stage_id: "dic-08"
    file: "work/subagent/dic-08-repair-plan.md"
    purpose: "Emit advisory-only repair recommendations and verification suggestions."
    summary_output: "logs/trace/consistency/08-repair-plan.md"
    gate_output: "logs/trace/consistency/08-repair-plan-gate.json"
    evidence_index: "logs/trace/consistency/08-repair-plan-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/08-repair-plan.json"
  - stage_id: "dic-09"
    file: "work/subagent/dic-09-finalize.md"
    purpose: "Assemble final reporting from complete or partial stage outputs."
    summary_output: "logs/trace/consistency/09-finalization-summary.md"
    gate_output: "logs/trace/consistency/09-finalization-gate.json"
    evidence_index: "logs/trace/consistency/09-finalization-evidence.json"
    structured_outputs:
      - "logs/trace/consistency/09-verification-results.json"
      - "logs/trace/consistency/09-final-report-input.json"
      - "logs/trace/final-report.md"
      - "result/output.md"
      - "result/issues/00-summary.md"
