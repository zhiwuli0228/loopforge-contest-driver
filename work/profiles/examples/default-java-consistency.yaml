profile:
  name: "default-java-consistency"
  class: "example"
  role: "authoritative-default"
  authoritative: true
  supersedes:
    - "profiles/examples/consistency-check.yaml"
    - "profiles/examples/java-consistency-check.yaml"
  intent: "default design-implementation consistency contract for Java-first contest repair with generic fallback"

task:
  mode: "consistency-check"
  objective: "repair the implementation under SUBMISSION_ROOT/code to satisfy the documented design contract in SUBMISSION_ROOT while preserving immutable contest baselines and proving progress with verification"
  language:
    detection: "auto"
    default_adapter: "java"
    fallback_adapter: "generic"
    supported_adapters:
      - "java"
      - "generic"

contracts:
  skill: "work/skills/design-implementation-consistency/SKILL.md"
  stages: "work/profiles/superspec/design-implementation-consistency-stages.yaml"
  guards: "work/profiles/superpower/design-implementation-consistency-guards.yaml"
  stage_packages: "work/subagent/design-implementation-consistency-stage-map.yaml"

inputs:
  required:
    - "SUBMISSION_ROOT/README.md"
    - "SUBMISSION_ROOT/design-docs"
    - "SUBMISSION_ROOT/code"
  optional:
    - "SUBMISSION_ROOT/test-cases"
    - "SUBMISSION_ROOT/maven-settings.xml"
    - "verification override commands"
    - "traceability focus"

execution:
  strategy: "repair-and-verify"
  unattended: true
  allow_manual_interaction: false
  allow_patch: true
  allow_code_generation: true
  fail_soft: true
  always_finalize: true
  max_repair_rounds: 1
  mutable_paths:
    - "SUBMISSION_ROOT/code/**"
    - "SUBMISSION_ROOT/maven-settings.xml"

analysis:
  dimensions:
    - "api_contract"
    - "data_model"
    - "state_flow"
    - "business_rule"
    - "error_handling"
    - "config"
    - "security"
    - "test_coverage"

language:
  detection:
    enabled: true
    selection:
      require_evidence: true
      inventory_output: "logs/trace/consistency/02-source-inventory.json"
      selection_output: "logs/trace/consistency/02-adapter-selection.json"
    selectors:
      java:
        files:
          - "pom.xml"
          - "build.gradle"
          - "build.gradle.kts"
          - "settings.gradle"
          - "settings.gradle.kts"
        source_globs:
          - "**/*.java"
      generic:
        fallback: true
  adapters:
    java:
      framework_detection:
        - "spring"
        - "springboot"
        - "springmvc"
        - "mybatis"
        - "maven"
        - "gradle"
      source_patterns:
        controllers:
          - "**/*Controller.java"
          - "**/*Resource.java"
        services:
          - "**/*Service.java"
          - "**/*ServiceImpl.java"
        data_models:
          - "**/*DTO.java"
          - "**/*Request.java"
          - "**/*Response.java"
          - "**/*Entity.java"
          - "**/*VO.java"
        tests:
          - "**/*Test.java"
          - "**/*Tests.java"
      verification:
        preferred_commands:
          - "mvn -s maven-settings.xml -f code/pom.xml test"
          - "mvn -s maven-settings.xml -f code/pom.xml install -DskipTests"
          - "mvn -s maven-settings.xml -f test-cases/pom.xml test"
        fallback_commands:
          - "./mvnw test"
          - "mvn test"
          - "./gradlew test"
          - "gradle test"
    generic:
      verification:
        preferred_commands: []
        fallback_commands: []

verification:
  source: "submission-readme-first"
  working_directory_hint: "SUBMISSION_ROOT"
  command_selection:
    source: "contest-contract-or-detected-adapter"
    ordered_classes:
      - name: "project_tests"
        command: "mvn -s maven-settings.xml -f code/pom.xml test"
        required_before: []
      - name: "project_install"
        command: "mvn -s maven-settings.xml -f code/pom.xml install -DskipTests"
        required_before:
          - "black_box_tests"
      - name: "black_box_tests"
        command: "mvn -s maven-settings.xml -f test-cases/pom.xml test"
        required_before: []
    java_fallback:
      - "./mvnw test"
      - "mvn test"
      - "./gradlew test"
      - "gradle test"
    generic_fallback: []
    on_missing_command: "report-unavailable"
  allow_degraded_verification: true
  require_failure_reason: true
  require_stdout_stderr_summary: true
  commands: []

reporting:
  final_report: "logs/trace/final-report.md"
  result_report: "result/output.md"
  issue_summary: "result/issues/00-summary.md"
  consistency_trace_root: "logs/trace/consistency"
  final_statuses:
    - "SUBMISSION_PASSED"
    - "SUBMISSION_PARTIAL"
    - "SUBMISSION_BLOCKED"
    - "SUBMISSION_INVALID"
  model_paths:
    acceptance_baseline: "logs/trace/consistency/01-acceptance-baseline.json"
    source_inventory: "logs/trace/consistency/02-source-inventory.json"
    adapter_selection: "logs/trace/consistency/02-adapter-selection.json"
    gap_model: "logs/trace/consistency/03-gap-model.json"
    repair_batches: "logs/trace/consistency/04-repair-batches.json"
    repair_execution: "logs/trace/consistency/05-repair-execution.json"
    build_verification: "logs/trace/consistency/06-build-verification.json"
    black_box_verification: "logs/trace/consistency/07-black-box-verification.json"
    retry_repair: "logs/trace/consistency/08-retry-repair.json"
    verification_results: "logs/trace/consistency/09-verification-results.json"
    final_report_input: "logs/trace/consistency/09-final-report-input.json"
