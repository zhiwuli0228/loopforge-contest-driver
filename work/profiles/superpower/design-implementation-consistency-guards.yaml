superpower:
  name: "design-implementation-consistency-guards"
  version: "1.0"
  purpose: "Deny-by-default guardrails for repair-and-verify design-implementation consistency execution."
  default_policy: "deny-by-default"

execution:
  strategy: "repair-and-verify"
  unattended: true
  allow_manual_interaction: false
  allow_patch: true
  allow_code_generation: true
  fail_soft: true
  always_finalize: true
  max_repair_rounds: 1
  handoff_mode: "file-paths-and-summaries-only"

shared_paths:
  denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
  final_report: "logs/trace/final-report.md"
  result_report: "result/output.md"
  issue_summary: "result/issues/00-summary.md"
  mutable_support_assets:
    - "SUBMISSION_ROOT/maven-settings.xml"

source_write_policy:
  mutable_targets:
    - "SUBMISSION_ROOT/code/**"
    - "SUBMISSION_ROOT/maven-settings.xml"
  forbidden_paths:
    - "SUBMISSION_ROOT/README.md"
    - "SUBMISSION_ROOT/design-docs/**"
    - "SUBMISSION_ROOT/test-cases/**"
    - "SUBMISSION_ROOT/contest.meta.yaml"
    - "SUBMISSION_ROOT/contest.meta.yml"
  required_denial_evidence: "logs/trace/consistency/guard-denials.jsonl"

stage_guards:
  - stage_id: "dic-00"
    read_allowlist:
      - "INSTRUCTION.md"
      - "work/loopforge.config.yaml"
      - "work/profiles/examples/default-java-consistency.yaml"
      - "work/profiles/superspec/design-implementation-consistency-stages.yaml"
      - "work/profiles/superpower/design-implementation-consistency-guards.yaml"
      - "work/subagent/design-implementation-consistency-stage-map.yaml"
      - "work/design/README.md"
      - "SUBMISSION_ROOT/**"
    write_allowlist:
      - "logs/trace/consistency/00-preflight-report.md"
      - "logs/trace/consistency/00-preflight-gate.json"
      - "logs/trace/consistency/00-preflight-evidence.json"
      - "logs/trace/consistency/00-submission-layout.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-01"
    read_allowlist:
      - "SUBMISSION_ROOT/README.md"
      - "SUBMISSION_ROOT/design-docs/**"
      - "logs/trace/consistency/00-preflight-report.md"
      - "logs/trace/consistency/00-preflight-gate.json"
      - "logs/trace/consistency/00-preflight-evidence.json"
      - "logs/trace/consistency/00-submission-layout.json"
    write_allowlist:
      - "logs/trace/consistency/01-design-intake.md"
      - "logs/trace/consistency/01-acceptance-baseline.json"
      - "logs/trace/consistency/01-design-intake-gate.json"
      - "logs/trace/consistency/01-design-intake-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-02"
    read_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/test-cases/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/00-preflight-report.md"
      - "logs/trace/consistency/00-preflight-gate.json"
      - "logs/trace/consistency/01-design-intake.md"
      - "logs/trace/consistency/01-design-intake-gate.json"
      - "logs/trace/consistency/01-design-intake-evidence.json"
      - "logs/trace/consistency/01-acceptance-baseline.json"
      - "logs/trace/consistency/00-submission-layout.json"
    write_allowlist:
      - "logs/trace/consistency/02-source-inventory.md"
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/02-adapter-selection.json"
      - "logs/trace/consistency/02-source-inventory-gate.json"
      - "logs/trace/consistency/02-source-inventory-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-03"
    read_allowlist:
      - "logs/trace/consistency/01-acceptance-baseline.json"
      - "logs/trace/consistency/01-design-intake.md"
      - "logs/trace/consistency/01-design-intake-gate.json"
      - "logs/trace/consistency/01-design-intake-evidence.json"
      - "logs/trace/consistency/02-source-inventory.md"
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/02-adapter-selection.json"
      - "logs/trace/consistency/02-source-inventory-gate.json"
      - "SUBMISSION_ROOT/README.md"
      - "SUBMISSION_ROOT/design-docs/**"
      - "SUBMISSION_ROOT/code/**"
    write_allowlist:
      - "logs/trace/consistency/03-gap-model-summary.md"
      - "logs/trace/consistency/03-gap-model.json"
      - "logs/trace/consistency/03-gap-model-gate.json"
      - "logs/trace/consistency/03-gap-model-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-04"
    read_allowlist:
      - "logs/trace/consistency/00-submission-layout.json"
      - "logs/trace/consistency/01-acceptance-baseline.json"
      - "logs/trace/consistency/02-source-inventory.md"
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/02-adapter-selection.json"
      - "logs/trace/consistency/03-gap-model-summary.md"
      - "logs/trace/consistency/03-gap-model.json"
      - "logs/trace/consistency/03-gap-model-gate.json"
      - "logs/trace/consistency/03-gap-model-evidence.json"
    write_allowlist:
