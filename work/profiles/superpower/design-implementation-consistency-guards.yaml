      - "logs/trace/consistency/06-drift-findings.json"
      - "logs/trace/consistency/06-drift-analysis-gate.json"
      - "logs/trace/consistency/06-drift-analysis-evidence.json"
      - "logs/trace/consistency/07-risk-classification.md"
      - "logs/trace/consistency/07-risk-classification.json"
      - "logs/trace/consistency/07-risk-classification-gate.json"
      - "logs/trace/consistency/07-risk-classification-evidence.json"
    write_allowlist:
      - "logs/trace/consistency/08-repair-plan.md"
      - "logs/trace/consistency/08-repair-plan.json"
      - "logs/trace/consistency/08-repair-plan-gate.json"
      - "logs/trace/consistency/08-repair-plan-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-09"
    read_allowlist:
      - "work/design/README.md"
      - "work/loopforge.config.yaml"
      - "logs/trace/consistency/*.md"
      - "logs/trace/consistency/*.json"
      - "logs/trace/consistency/guard-denials.jsonl"
    write_allowlist:
      - "logs/trace/consistency/09-finalization-summary.md"
      - "logs/trace/consistency/09-finalization-gate.json"
      - "logs/trace/consistency/09-finalization-evidence.json"
      - "logs/trace/consistency/09-verification-results.json"
      - "logs/trace/consistency/09-final-report-input.json"
      - "logs/trace/final-report.md"
      - "result/output.md"
      - "result/issues/00-summary.md"
      - "logs/trace/consistency/guard-denials.jsonl"

negative_cases:
  - id: "source-root-write-denied"
    stage_id: "dic-04"
    attempted_write: "SOURCE_ROOT/src/Main.java"
    expected_result: "denied"
    denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
  - id: "cross-stage-write-denied"
    stage_id: "dic-06"
    attempted_write: "logs/trace/consistency/08-repair-plan.md"
    expected_result: "denied"
    denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
