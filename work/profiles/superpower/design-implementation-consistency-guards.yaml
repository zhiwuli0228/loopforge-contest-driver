      - "logs/trace/consistency/04-repair-batches.json"
      - "logs/trace/consistency/04-repair-batches-gate.json"
      - "logs/trace/consistency/04-repair-batches-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-05"
    read_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/00-submission-layout.json"
      - "logs/trace/consistency/01-acceptance-baseline.json"
      - "logs/trace/consistency/02-source-inventory.json"
      - "logs/trace/consistency/03-gap-model.json"
      - "logs/trace/consistency/04-repair-batches.md"
      - "logs/trace/consistency/04-repair-batches.json"
      - "logs/trace/consistency/04-repair-batches-gate.json"
      - "logs/trace/consistency/04-repair-batches-evidence.json"
    write_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/05-repair-execution.md"
      - "logs/trace/consistency/05-repair-execution.json"
      - "logs/trace/consistency/05-repair-execution-gate.json"
      - "logs/trace/consistency/05-repair-execution-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-06"
    read_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/05-repair-execution.md"
      - "logs/trace/consistency/05-repair-execution.json"
      - "logs/trace/consistency/05-repair-execution-gate.json"
      - "logs/trace/consistency/05-repair-execution-evidence.json"
    write_allowlist:
      - "logs/trace/consistency/06-build-verification.md"
      - "logs/trace/consistency/06-build-verification.json"
      - "logs/trace/consistency/06-build-verification-gate.json"
      - "logs/trace/consistency/06-build-verification-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-07"
    read_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/test-cases/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/06-build-verification.md"
      - "logs/trace/consistency/06-build-verification.json"
      - "logs/trace/consistency/06-build-verification-gate.json"
      - "logs/trace/consistency/06-build-verification-evidence.json"
    write_allowlist:
      - "logs/trace/consistency/07-black-box-verification.md"
      - "logs/trace/consistency/07-black-box-verification.json"
      - "logs/trace/consistency/07-black-box-verification-gate.json"
      - "logs/trace/consistency/07-black-box-verification-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-08"
    read_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/03-gap-model.json"
      - "logs/trace/consistency/04-repair-batches.json"
      - "logs/trace/consistency/06-build-verification.md"
      - "logs/trace/consistency/06-build-verification.json"
      - "logs/trace/consistency/06-build-verification-gate.json"
      - "logs/trace/consistency/06-build-verification-evidence.json"
      - "logs/trace/consistency/07-black-box-verification.md"
      - "logs/trace/consistency/07-black-box-verification.json"
      - "logs/trace/consistency/07-black-box-verification-gate.json"
      - "logs/trace/consistency/07-black-box-verification-evidence.json"
    write_allowlist:
      - "SUBMISSION_ROOT/code/**"
      - "SUBMISSION_ROOT/maven-settings.xml"
      - "logs/trace/consistency/08-retry-repair.md"
      - "logs/trace/consistency/08-retry-repair.json"
      - "logs/trace/consistency/08-retry-repair-gate.json"
      - "logs/trace/consistency/08-retry-repair-evidence.json"
      - "logs/trace/consistency/guard-denials.jsonl"

  - stage_id: "dic-09"
    read_allowlist:
      - "SUBMISSION_ROOT/README.md"
      - "logs/trace/consistency/00-submission-layout.json"
      - "work/loopforge.config.yaml"
      - "logs/trace/consistency/*.md"
      - "logs/trace/consistency/*.json"
      - "logs/trace/consistency/guard-denials.jsonl"
    write_allowlist:
      - "logs/trace/consistency/09-finalization-summary.md"
      - "logs/trace/consistency/09-finalization-gate.json"
      - "logs/trace/consistency/09-finalization-evidence.json"
      - "logs/trace/consistency/09-verification-results.json"
      - "logs/trace/consistency/09-final-report-input.json"
      - "logs/trace/final-report.md"
      - "result/output.md"
      - "result/issues/00-summary.md"
      - "logs/trace/consistency/guard-denials.jsonl"

negative_cases:
  - id: "baseline-write-denied"
    stage_id: "dic-05"
    attempted_write: "SUBMISSION_ROOT/design-docs/service-design.md"
    expected_result: "denied"
    denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
  - id: "non-repair-stage-source-write-denied"
    stage_id: "dic-06"
    attempted_write: "SUBMISSION_ROOT/code/src/Main.java"
    expected_result: "denied"
    denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
  - id: "cross-stage-write-denied"
    stage_id: "dic-07"
    attempted_write: "logs/trace/consistency/08-retry-repair.md"
    expected_result: "denied"
    denial_evidence: "logs/trace/consistency/guard-denials.jsonl"
