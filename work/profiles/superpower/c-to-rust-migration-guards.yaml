# SuperPower Guards: Permission boundaries for C-to-Rust migration phases
# Default-deny policy: anything not explicitly allowed is forbidden.
# No project-specific paths — all patterns are generic and relative.

phases:
  preflight:
    description: Verify tools.py and environment are ready
    subagent: work/subagent/c2r-00-preflight.md
    allowed_tools:
      - self-check
    allowed_fs:
      - operation: read
        path_pattern: "work/**"
    forbidden:
      - any write operations
      - any source modification

  understand:
    description: Parse source, analyze capabilities per module, synthesize capability map
    subagent: work/subagent/c2r-01-understand.md
    allowed_tools:
      - parse-source
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "logs/trace/c-to-rust/**"
      - operation: write
        path_pattern: "openspec/changes/*/"
    forbidden:
      - modify C source files
      - modify tools.py
      - modify profiles
      - modify work/output/

  design:
    description: Create technical design document
    subagent: work/subagent/c2r-02-design.md
    allowed_tools: []
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "openspec/changes/*/design.md"
    forbidden:
      - modify source code
      - modify tools.py
      - modify profiles

  spec:
    description: Write ONE spec part for 2-4 functions (sub-batched by function count, parallel)
    subagent: work/subagent/c2r-03-spec.md
    allowed_tools: []
    allowed_fs:
      - operation: read
        path_pattern: "**"
    forbidden:
      - modify source code
      - modify tools.py
      - modify profiles

  plan:
    description: Create implementation plan, task list, AND test-migration spec (delegated to subagent)
    subagent: work/subagent/c2r-04-plan.md
    allowed_tools: []
    allowed_fs:
      - operation: read
        path_pattern: "**"
    forbidden:
      - modify source code
      - modify tools.py
      - modify profiles

  implement:
    description: Write Rust source code per batch (compile only, no tests)
    subagent: work/subagent/c2r-05a-implement.md
    allowed_tools:
      - run-verification
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "src/**/*.rs"
      - operation: write
        path_pattern: "Cargo.toml"
      - operation: write
        path_pattern: "Cargo.lock"

  unit-test:
    description: Write unit tests per batch and fix implementation bugs
    subagent: work/subagent/c2r-05b-unit-test.md
    allowed_tools:
      - run-verification
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "tests/**/*.rs"
      - operation: write
        path_pattern: "src/**/*.rs"
      - operation: create
        path_pattern: "src/**/*.rs"
      - operation: create
        path_pattern: "tests/**/*.rs"
    forbidden:
      - modify tools.py
      - modify profiles
      - modify openspec/
      - modify work/skills/
      - modify work/subagent/

  test:
    description: Write integration tests and verify C test coverage
    subagent: work/subagent/c2r-06-test.md
    allowed_tools:
      - run-verification
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "tests/**/*.rs"
      - operation: write
        path_pattern: "src/**/*.rs"
      - operation: create
        path_pattern: "tests/**/*.rs"
    forbidden:
      - modify tools.py
      - modify profiles
      - modify openspec/
      - modify work/skills/
      - modify work/subagent/

  repair:
    description: Fix build/test failures
    subagent: work/subagent/c2r-07-repair.md
    allowed_tools:
      - run-verification
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "src/**/*.rs"
      - operation: write
        path_pattern: "tests/**/*.rs"
      - operation: write
        path_pattern: "Cargo.toml"
    forbidden:
      - modify tools.py
      - modify profiles
      - modify openspec/
      - modify work/skills/
      - modify work/subagent/

  semantic-audit:
    description: Write and run invariant tests
    subagent: work/subagent/c2r-08-semantic-audit.md
    allowed_tools:
      - run-verification
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "tests/**/*.rs"
      - operation: create
        path_pattern: "tests/**/*.rs"
    forbidden:
      - modify source code under migration
      - modify tools.py
      - modify profiles

  quality-gates:
    description: Run quality gate checks
    subagent: work/subagent/c2r-09-quality-gates.md
    allowed_tools:
      - check-unsafe
      - fault-injection
      - neutrality-audit
    allowed_fs:
      - operation: read
        path_pattern: "**"
    forbidden:
      - any write operations
      - any source modification

  finalize:
    description: Write final reports
    subagent: work/subagent/c2r-10-finalize.md
    allowed_tools:
      - write-report
    allowed_fs:
      - operation: read
        path_pattern: "**"
      - operation: write
        path_pattern: "result/**"
      - operation: write
        path_pattern: "issues/**"
      - operation: write
        path_pattern: "openspec/changes/*/verification-report.md"
    forbidden:
      - modify source code
      - modify tools.py
      - modify profiles
